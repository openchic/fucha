name: Test

on:
  push:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        description: Commit to test
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: pnpm/action-setup@v4.4.0
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Unit and component tests
        run: pnpm test
      - name: Build and run Electron integration tests
        run: pnpm test:e2e
